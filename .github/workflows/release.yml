name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # workflow_dispatch 时 github.ref_name 是分支名，不能当 tag 用；
          # v__VERSION__ 由 tauri-action 替换为 tauri.conf.json 的 version。
          tagName: v__VERSION__
          releaseName: 'Dazi v__VERSION__'
          releaseBody: |
            Windows 安装包见下方 Assets：
            - 推荐下载 `.exe`（NSIS 安装程序），双击按向导安装即可。
            - 也可选择 `.msi` 安装包。
            - 未签名：SmartScreen 提示时选「更多信息 → 仍要运行」。
            - Windows 安装程序会自动处理 WebView2；若启动时仍提示缺少 WebView2，请手动安装：
              https://developer.microsoft.com/en-us/microsoft-edge/webview2/

            macOS 安装包见下方 Assets：
            - 下载 `.dmg`（Intel 与 Apple Silicon 通用），打开后把 Dazi 拖到 Applications 文件夹。
            - 未签名：首次打开被拦截时，到「系统设置 → 隐私与安全性」点「仍要打开」。

            前置依赖：需自行安装 Claude Code CLI。
          releaseDraft: true
          prerelease: false

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # workflow_dispatch 时 github.ref_name 是分支名，不能当 tag 用；
          # v__VERSION__ 由 tauri-action 替换为 tauri.conf.json 的 version。
          tagName: v__VERSION__
          releaseName: 'Dazi v__VERSION__'
          # universal：Intel + Apple Silicon 单包，避免按架构分发两个 dmg
          args: --target universal-apple-darwin
          releaseBody: |
            Windows 安装包见下方 Assets：
            - 推荐下载 `.exe`（NSIS 安装程序），双击按向导安装即可。
            - 也可选择 `.msi` 安装包。
            - 未签名：SmartScreen 提示时选「更多信息 → 仍要运行」。
            - Windows 安装程序会自动处理 WebView2；若启动时仍提示缺少 WebView2，请手动安装：
              https://developer.microsoft.com/en-us/microsoft-edge/webview2/

            macOS 安装包见下方 Assets：
            - 下载 `.dmg`（Intel 与 Apple Silicon 通用），打开后把 Dazi 拖到 Applications 文件夹。
            - 未签名：首次打开被拦截时，到「系统设置 → 隐私与安全性」点「仍要打开」。

            前置依赖：需自行安装 Claude Code CLI。
          releaseDraft: true
          prerelease: false
